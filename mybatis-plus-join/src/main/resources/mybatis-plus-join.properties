# MyBatis-Plus-Join Configuration Properties
# These properties complement the YAML configuration

# Enable sub-table logic for nested DTO mapping
mybatis-plus-join.sub-table-logic=true

# Sub-table mapping configuration
# Format: mybatis-plus-join.sub-table.<fieldName>=<JSON mapping>
# Example: mybatis-plus-join.sub-table.items={"productId":"product_id",...}

# If sub-table-logic is disabled, the join extension will attempt
# to split joined data into nested DTOs automatically.
