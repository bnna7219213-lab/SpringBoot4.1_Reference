spring:
  application:
    name: mybatis-plus-crud

  # H2 In-Memory Database Configuration
  datasource:
    url: jdbc:h2:mem:mpcrud;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console (development only)
  h2:
    console:
      enabled: true
      path: /h2-console

  # SQL Initialization
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# MyBatis-Plus Configuration
mybatis-plus:
  # Mapper XML locations
  mapper-locations: classpath*:/mapper/**/*.xml
  # Entity package scanning
  type-aliases-package: com.example.mpcrud.entity
  global-config:
    db-config:
      # Primary key auto-increment
      id-type: auto
      # Logic delete configuration
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # Table prefix (empty for none)
      table-prefix:
  configuration:
    # Camel case mapping
    map-underscore-to-camel-case: true
    # SQL logging
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Server
server:
  port: 8080

# Logging
logging:
  level:
    com.example.mpcrud: DEBUG
    com.baomidou.mybatisplus: WARN
